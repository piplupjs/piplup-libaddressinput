<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vanilla-dom example — @piplup/libaddressinput</title>
    <style>
      body {
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
        color: #1a1a1a;
        max-width: 32rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
      p { color: #555; margin-top: 0; margin-bottom: 1.5rem; }
      label { display: block; margin-top: 0.75rem; font-weight: 600; font-size: 13px; }
      input, select {
        width: 100%;
        box-sizing: border-box;
        padding: 0.5rem 0.6rem;
        margin-top: 0.2rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font: inherit;
      }
      input:focus, select:focus {
        outline: none;
        border-color: #0052cc;
        box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.2);
      }
      input.input-error, select.input-error {
        border-color: #b00020;
      }
      .row { display: flex; gap: 0.75rem; }
      .row > div { flex: 1; min-width: 0; }
      .error {
        color: #b00020;
        font-size: 12px;
        margin-top: 0.25rem;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.6rem 1.25rem;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #0052cc;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover { background: #0747a6; }
      button:disabled { background: #bbb; cursor: not-allowed; }
      #result:empty { display: none; }
      #result {
        white-space: pre-wrap;
        background: #f4f4f4;
        border-radius: 4px;
        padding: 0.75rem 1rem;
        margin-top: 1rem;
        font-family: inherit;
        font-size: 13px;
      }
      #result.success {
        background: #e3fcef;
        color: #006644;
        font-weight: 600;
      }
      #result.has-errors {
        background: #ffebe6;
        color: #de350b;
      }
    </style>
  </head>
  <body>
    <h1>Address form (vanilla DOM)</h1>
    <p>No framework — this page maps <code>buildLayout()</code> output directly to hand-written DOM elements.</p>

    <label for="region">Region</label>
    <select id="region"></select>

    <form id="fields"></form>

    <button id="validate" type="button">Validate</button>
    <div id="result"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
