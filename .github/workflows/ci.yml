name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        node: [18, 20, 22]
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: pnpm dlx commitlint --from ${{ github.event.pull_request.base.sha || 'origin/main~1' }} --to HEAD
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deno:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: denoland/setup-deno@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @piplup/libaddressinput build
      - run: deno run --no-config packages/core/dist/index.js

  bun:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @piplup/libaddressinput build
      - run: bun run packages/core/dist/index.js

  examples:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @piplup/libaddressinput build
      # Each example's own tsconfig.json is standalone (doesn't extend the
      # monorepo's tsconfig.base.json — see .planning/PLAN.md Phase 7), so
      # typechecking them here also guards against that staying true.
      - run: pnpm --filter node-cli-example typecheck
      - run: pnpm --filter vanilla-dom-example build
      - run: pnpm --filter react-basic-example build
      - run: pnpm --filter react-form-controller-example build
      - run: pnpm --filter react-ssr-example typecheck
      # Smoke test: node-cli's --help exits 0 with no network access needed.
      - run: pnpm --filter node-cli-example start -- --help

  golden-crosscheck:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @piplup/libaddressinput build
      - name: Run C++ golden cross-check
        run: bash test/golden/cpp-harness/build.sh
