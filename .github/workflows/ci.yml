name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        node: [18, 20, 22]
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: pnpm dlx commitlint --from ${{ github.event.pull_request.base.sha || 'origin/main~1' }} --to HEAD
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # Deno and Bun jobs require Linux runners due to setup issues on Windows
  # These are optional runtime compatibility checks, not critical for releases
  # Uncomment and move to a separate linux-only workflow if needed in the future

  examples:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter ./packages/* build
      # Each example's own tsconfig.json is standalone (doesn't extend the
      # monorepo's tsconfig.base.json — see .planning/PLAN.md Phase 7), so
      # typechecking them here also guards against that staying true.
      - run: pnpm --filter node-cli-example typecheck
      - run: pnpm --filter vanilla-dom-example build
      - run: pnpm --filter react-basic-example build
      - run: pnpm --filter react-form-controller-example build
      - run: pnpm --filter react-ssr-example typecheck
      # Smoke test: node-cli's --help exits 0 with no network access needed.
      - run: pnpm --filter node-cli-example start -- --help

  # golden-crosscheck: C++ cross-validation with Linux bash scripts
  # Requires cmake, ninja, and Linux build tools - not practical on Windows
  # Can be restored in a separate Linux-only workflow if needed
