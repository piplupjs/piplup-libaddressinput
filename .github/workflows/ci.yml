name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: pnpm dlx commitlint --from ${{ github.event.pull_request.base.sha || 'origin/main~1' }} --to HEAD
        # Current commitlint and @piplup/code-infra need Node 22.
        if: matrix.node == 22 && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main')
      - run: pnpm lint
        if: matrix.node == 22
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter './packages/*' build
      # Each example's own tsconfig.json is standalone (doesn't extend the
      # monorepo's tsconfig.base.json — see .planning/PLAN.md Phase 7), so
      # typechecking them here also guards against that staying true.
      - run: pnpm --filter node-cli-example typecheck
      - run: pnpm --filter vanilla-dom-example build
      - run: pnpm --filter react-basic-example build
      - run: pnpm --filter react-form-controller-example build
      - run: pnpm --filter react-ssr-example typecheck
      # Smoke test: node-cli's --help exits 0 with no network access needed.
      - run: pnpm --filter node-cli-example start -- --help
